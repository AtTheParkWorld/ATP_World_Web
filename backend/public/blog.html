<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/atp.min.css?v=f8e13743c3">
  <link rel="preload" as="image" href="/atp-logo-transparent.webp" type="image/webp">
  <script src="/atp.bundle.min.js?v=a4f8e7097e"></script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The ATP Journal — Stories, training & community | At The Park</title>
  <link rel=icon type=image/png sizes=32x32 href=/favicon-32.png><link rel=icon type=image/png sizes=16x16 href=/favicon-16.png><link rel=icon href=/favicon.ico><link rel=apple-touch-icon sizes=180x180 href=/apple-touch-icon.png>
<meta name="description" content="Stories from the ATP community — coach tips, member journeys, training breakdowns, and what's happening on the ground in Dubai, Al Ain and Muscat.">
<meta property="og:title" content="The ATP Journal">
<meta property="og:description" content="Stories from the world's largest free outdoor fitness community.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --green:#A8FF00;--green-dark:#8FD800;--green-light:#C6FF55;
  --black:#0a0a0a;--dark:#111111;--dark2:#161616;--dark3:#1f1f1f;
  --muted:#888888;--light:#aaaaaa;--white:#ffffff;
  --line:rgba(255,255,255,.10);--line-soft:rgba(255,255,255,.06);
  --ff-display:'Barlow Condensed',sans-serif;--ff-body:'DM Sans',sans-serif;
  --nav-h:68px;--max:1320px;--radius:8px;--radius-lg:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--ff-body);background:var(--black);color:var(--white);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:var(--ff-body);background:none;border:none;color:inherit}

#nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 40px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
#nav.scrolled{background:rgba(10,10,10,.97);border-bottom-color:rgba(168,255,0,.18);backdrop-filter:blur(16px)}
.nav-inner{width:100%;max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px}
.nav-logo img{height:32px;width:auto;display:block}
.nav-links{display:flex;align-items:center;gap:32px;list-style:none}
.nav-links a{font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--light);transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--green)}
.nav-actions{display:flex;align-items:center;gap:12px}
.btn-ghost{font-size:13px;font-weight:600;color:var(--white);border:1px solid rgba(255,255,255,.2);padding:9px 20px;border-radius:var(--radius);background:transparent;transition:border-color .2s;letter-spacing:.03em}
.btn-ghost:hover{border-color:var(--white)}
.btn-primary{font-size:13px;font-weight:700;background:var(--green);color:var(--white);padding:10px 22px;border-radius:var(--radius);border:none;letter-spacing:.03em;transition:background .2s,transform .15s}
.btn-primary:hover{background:var(--green-dark);transform:translateY(-1px)}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:4px}
.hamburger span{display:block;width:22px;height:2px;background:var(--white);border-radius:2px}

/* HERO */
.bl-hero{padding:calc(var(--nav-h) + 80px) 40px 60px;background:var(--dark2);border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden}
.bl-hero::before{content:'';position:absolute;top:var(--nav-h);left:0;right:0;height:3px;background:var(--green);z-index:1}
.bl-hero-inner{max-width:var(--max);margin:0 auto;position:relative;z-index:2}
.bl-hero-eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:14px;display:inline-flex;align-items:center;gap:12px}
.bl-hero-eyebrow::before{content:'';display:block;width:24px;height:2px;background:var(--green)}
.bl-hero h1{font-family:var(--ff-display);font-size:clamp(48px,6.5vw,88px);font-weight:900;line-height:.92;text-transform:uppercase;letter-spacing:-.01em;margin-bottom:16px;max-width:880px}
.bl-hero h1 .acc{color:var(--green)}
/* The lime square marker, echoed in the hero so the motif reads as a
   system rather than a tile decoration. */
.bl-hero-inner::before{content:'';position:absolute;top:-34px;left:0;width:14px;height:14px;background:var(--green)}
.bl-hero-inner{padding-top:8px}
.bl-hero-sub{font-size:17px;line-height:1.65;color:rgba(255,255,255,.78);max-width:640px;font-weight:300}

/* Filter chips */
.bl-filters{padding:24px 40px 0;max-width:var(--max);margin:0 auto;width:100%}
.bl-chips{display:flex;gap:8px;flex-wrap:wrap}
.bl-chip{padding:8px 16px;font-size:12px;font-weight:600;color:var(--light);background:var(--dark2);border:1px solid var(--line-soft);border-radius:18px;cursor:pointer;transition:color .15s,border-color .15s,background .15s;letter-spacing:.02em;white-space:nowrap}
.bl-chip:hover{color:#fff;border-color:rgba(255,255,255,.22)}
.bl-chip.active{color:#0a0a0a;background:var(--green);border-color:var(--green);font-weight:700}

/* FEATURED + GRID */
.bl-list{padding:36px 40px 80px;max-width:var(--max);margin:0 auto;width:100%;flex:1}

/* ── MODULAR TILE MOSAIC ──────────────────────────────────────
   Inspired by Pablo Centeno's BIT identity system (founder 2026-09-17):
   an asymmetric grid of tiles at different spans, alternating photo,
   solid-lime and solid-dark blocks, with a small lime square as a
   recurring marker. The pattern is generated from the post list rather
   than hand-placed, so it holds with 3 posts or 30.                    */
.bl-mosaic{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:190px;gap:14px;grid-auto-flow:row dense}

.bl-tile{position:relative;overflow:hidden;border-radius:var(--radius-lg);text-decoration:none;color:inherit;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.bl-tile:hover{transform:translateY(-3px)}
.bl-tile:focus-visible{outline:2px solid var(--green);outline-offset:3px}

/* The BIT marker — a small lime square that slides on hover */
.bl-mark{position:absolute;top:18px;left:18px;width:10px;height:10px;background:var(--green);z-index:3;transition:transform .35s cubic-bezier(.2,.7,.3,1)}
.bl-tile:hover .bl-mark{transform:translateX(6px)}
.bl-tile--lime .bl-mark{background:var(--black)}

/* Photo tiles */
.bl-tile--photo{background:linear-gradient(135deg,#0d1a0a,#1a3e0a)}
.bl-tile--photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:transform .7s cubic-bezier(.2,.7,.3,1)}
.bl-tile--photo:hover img{transform:scale(1.06)}
.bl-tile--photo::after{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(10,10,10,.12) 0%,rgba(10,10,10,.42) 38%,rgba(10,10,10,.82) 72%,rgba(10,10,10,.96) 100%)}
/* Tall tiles carry more copy, so they need the scrim to start higher. */
.bl-tile--photo[style*="span 2"]::after{background:linear-gradient(180deg,rgba(10,10,10,.10) 0%,rgba(10,10,10,.30) 42%,rgba(10,10,10,.80) 74%,rgba(10,10,10,.96) 100%)}
/* lime wipe on hover — the BIT colour-block move */
.bl-tile--photo::before{content:'';position:absolute;inset:0;z-index:2;background:var(--green);mix-blend-mode:hard-light;opacity:0;transition:opacity .35s}
.bl-tile--photo:hover::before{opacity:.16}

/* Solid tiles */
.bl-tile--lime{background:var(--green);color:var(--black)}
.bl-tile--dark{background:var(--dark2);border:1px solid var(--line-soft)}
.bl-tile--dark:hover{border-color:rgba(168,255,0,.42)}

.bl-tile-inner{position:relative;z-index:3;padding:24px;display:flex;flex-direction:column;gap:9px}
.bl-tile--right .bl-tile-inner{text-align:right;align-items:flex-end}
.bl-tile--right .bl-mark{left:auto;right:18px}
.bl-tile--right:hover .bl-mark{transform:translateX(-6px)}

.bl-tile-cat{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green)}
.bl-tile--lime .bl-tile-cat{color:rgba(10,10,10,.62)}
.bl-tile-title{font-family:var(--ff-display);font-weight:900;text-transform:uppercase;line-height:.94;letter-spacing:-.01em;font-size:23px;color:#fff}
.bl-tile--photo .bl-tile-title{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.bl-tile--photo .bl-tile-meta{color:rgba(255,255,255,.66)}
.bl-tile--lime .bl-tile-title{color:var(--black)}
.bl-tile-excerpt{font-size:13px;line-height:1.55;color:rgba(255,255,255,.72);font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bl-tile--lime .bl-tile-excerpt{color:rgba(10,10,10,.74)}
.bl-tile-meta{font-size:11px;letter-spacing:.05em;color:var(--muted)}
.bl-tile--lime .bl-tile-meta{color:rgba(10,10,10,.58)}
.bl-tile-meta .author{color:var(--light)}
.bl-tile--lime .bl-tile-meta .author{color:rgba(10,10,10,.78)}

/* Feature tile — the newest post, set big */
.bl-tile--feature .bl-tile-inner{padding:34px}
.bl-tile--feature .bl-tile-title{font-size:clamp(30px,3.6vw,52px)}
.bl-tile--feature .bl-tile-excerpt{-webkit-line-clamp:3;font-size:14.5px;max-width:52ch}
.bl-flag{position:absolute;top:0;right:0;z-index:3;background:var(--green);color:var(--black);font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;border-bottom-left-radius:var(--radius-lg)}

/* Statement tile — a brand beat between posts, not a link */
.bl-tile--say{background:var(--green);color:var(--black);justify-content:center;cursor:default}
.bl-tile--say .bl-tile-inner{padding:28px 34px}
.bl-tile--say[style*="span 12"] .bl-tile-inner{align-items:center;text-align:center}
.bl-say{font-family:var(--ff-display);font-weight:900;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;font-size:clamp(26px,2.6vw,40px)}
/* roman + italic pairing, BIT's signature type move */
.bl-say em{font-style:italic;font-weight:400}
.bl-say-sub{font-size:12px;font-weight:600;letter-spacing:.06em;color:rgba(10,10,10,.66);margin-top:10px}

@media (max-width:1100px){
  .bl-mosaic{grid-auto-rows:175px;gap:12px}
  .bl-tile-title{font-size:20px}
}
@media (max-width:820px){
  /* Collapse to a readable 2-column rhythm; tiles keep their character
     but every one becomes 6 or 12 wide. */
  .bl-mosaic{grid-template-columns:repeat(6,1fr);grid-auto-rows:168px}
  .bl-tile{grid-column:span 6 !important}
  .bl-tile--feature{grid-row:span 2 !important}
  .bl-tile--right .bl-tile-inner{text-align:left;align-items:flex-start}
  .bl-tile--right .bl-mark{left:18px;right:auto}
}

/* Empty + skeleton */
.bl-empty{padding:60px 24px;text-align:center;background:var(--dark2);border:1px dashed var(--line);border-radius:var(--radius-lg);color:var(--light)}
.bl-empty h3{font-family:var(--ff-display);font-size:24px;font-weight:800;text-transform:uppercase;color:#fff;margin-bottom:8px;letter-spacing:.005em}
.bl-empty p{font-size:14px;color:var(--muted);max-width:440px;margin:0 auto;line-height:1.6}
.bl-skel{background:linear-gradient(90deg,#141414 0%,#1f1f1f 50%,#141414 100%);background-size:200% 100%;border:1px solid var(--line-soft);border-radius:var(--radius-lg);overflow:hidden;animation:bl-shimmer 1.8s linear infinite;min-height:100%}
.bl-skel-cover{aspect-ratio:16/10;background:linear-gradient(90deg,#161616 0%,#1f1f1f 50%,#161616 100%);background-size:200% 100%;animation:bl-shimmer 1.8s linear infinite}
.bl-skel-body{padding:22px;display:flex;flex-direction:column;gap:10px}
.bl-skel-line{height:14px;background:#1f1f1f;border-radius:4px}
.bl-skel-line.short{width:60%}
.bl-skel-line.tall{height:22px}
@keyframes bl-pulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes bl-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* FOOTER */
.footer-min{background:#0d0d0d;padding:36px 40px 24px;border-top:1px solid var(--line-soft);font-family:var(--ff-body);margin-top:auto}
.footer-min-inner{max-width:1320px;margin:0 auto}
.footer-min-bot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
.footer-min-copy{font-size:12px;color:#666;margin:0}
.footer-legal{display:flex;gap:18px}
.footer-legal a{font-size:12px;color:#888;transition:color .2s}
.footer-legal a:hover{color:#fff}

@media (max-width:900px){
  #nav{padding:0 20px}
  .nav-links,.nav-actions{display:none}
  .hamburger{display:flex}
  #nav.mobile-open{height:auto;flex-direction:column;align-items:stretch;background:rgba(10,10,10,.98);padding:0 20px 24px}
  #nav.mobile-open .nav-links{display:flex;flex-direction:column;gap:18px;width:100%;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
  #nav.mobile-open .nav-actions{display:flex;flex-direction:column;width:100%;gap:8px;margin-top:14px}
  .bl-hero{padding:calc(var(--nav-h) + 48px) 20px 40px}
  .bl-filters{padding:18px 20px 0}
  .bl-list{padding:28px 20px 60px}
  .bl-featured{grid-template-columns:1fr}
  .bl-featured-body{padding:28px 24px}
  .bl-grid{grid-template-columns:1fr;gap:16px}
}
@media (max-width:1100px) and (min-width:901px){
  .bl-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div id="atp-nav-host" data-active=""></div>

<section class="bl-hero">
  <div class="bl-hero-inner">
    <div class="bl-hero-eyebrow" id="bl-hero-eyebrow">The ATP Journal</div>
    <h1 id="bl-hero-title">Beyond the <span class="acc">workout</span></h1>
    <p class="bl-hero-sub" id="bl-hero-sub">Coach insights, member journeys, training breakdowns, and what's actually happening on the ground in Dubai, Al Ain and Muscat. Updated regularly.</p>
  </div>
</section>

<!-- Hydrate hero copy from /api/cms/blog (admin → CMS → Blog Page). Falls
     back to the static defaults above if the API is unreachable. -->
<script>
(function() {
  fetch('/api/cms/blog')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){
      if (!d || !d.content || !d.content.hero) return;
      var h = d.content.hero;
      if (h.eyebrow) {
        var el = document.getElementById('bl-hero-eyebrow');
        if (el) el.textContent = h.eyebrow;
      }
      if (h.title) {
        // Title supports a trailing accent span via a sentinel: if the
        // admin-saved title contains "<accent>...</accent>" we render that
        // span as the green accent. Otherwise the whole string is plain.
        var el = document.getElementById('bl-hero-title');
        if (el) {
          var m = /^(.*?)<accent>(.+?)<\/accent>(.*)$/i.exec(h.title);
          if (m) {
            el.innerHTML = (m[1] || '').replace(/[<>&]/g, '') +
              '<span class="acc">' + m[2].replace(/[<>&]/g, '') + '</span>' +
              (m[3] || '').replace(/[<>&]/g, '');
          } else {
            el.textContent = h.title;
          }
        }
      }
      if (h.subtitle) {
        var el = document.getElementById('bl-hero-sub');
        if (el) el.textContent = h.subtitle;
      }
    })
    .catch(function(){ /* CMS unreachable — keep static defaults */ });
})();
</script>

<section class="bl-filters" id="bl-filters" style="display:none">
  <div class="bl-chips" id="bl-chips">
    <button class="bl-chip active" data-cat="">All posts</button>
  </div>
</section>

<section class="bl-list">
  <div id="bl-content">
    <!-- Loading state previews the mosaic itself, so the page doesn't
         reflow from a card grid into tiles once posts land. -->
    <div class="bl-mosaic">
      <div class="bl-skel" style="grid-column:span 8;grid-row:span 2"></div>
      <div class="bl-skel" style="grid-column:span 4"></div>
      <div class="bl-skel" style="grid-column:span 4"></div>
      <div class="bl-skel" style="grid-column:span 4;grid-row:span 2"></div>
      <div class="bl-skel" style="grid-column:span 4"></div>
      <div class="bl-skel" style="grid-column:span 4"></div>
    </div>
  </div>
</section>

<div id="atp-footer-host"></div>
<script>
(function () {
  'use strict';

  window.addEventListener('scroll', function () {
    var n = document.getElementById('nav');
    if (n) n.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function relTime(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function authorName(p) {
    if (!p.author) return 'ATP';
    return ((p.author.first_name || '') + ' ' + (p.author.last_name || '')).trim() || 'ATP';
  }

  /* ── Mosaic pattern ──────────────────────────────────────────
     Tile shapes cycle through this list (12-col grid). `kind` is a
     PREFERENCE: a post with a cover image always gets the photo
     treatment, one without falls back to a solid lime/dark block —
     which is why the grid still looks composed when half the posts
     have no artwork.                                                 */
  var TILE_PATTERN = [
    /* rows 1-2 */ { c: 8, r: 2, kind: 'photo', feature: true },
                   { c: 4, r: 1, kind: 'lime' },
                   { c: 4, r: 1, kind: 'photo' },
    /* row 3   */  { c: 4, r: 1, kind: 'photo' },
                   { c: 4, r: 1, kind: 'dark', right: true },
                   { c: 4, r: 1, kind: 'photo' },
    /* rows 4-5 */ { c: 4, r: 2, kind: 'photo' },
                   { c: 8, r: 1, kind: 'photo' },
                   { c: 8, r: 1, kind: 'lime', right: true },
    /* row 6   */  { c: 6, r: 1, kind: 'photo' },
                   { c: 6, r: 1, kind: 'dark' },
  ];
  var CYCLE = TILE_PATTERN.length;   // 11 tiles = 6 complete rows

  /* Brand beats dropped between posts — the BIT system breaks its grid
     with pure type blocks, and an all-cards page reads flatter. */
  var STATEMENTS = [
    { line: 'Never train <em>alone.</em>', sub: 'Free sessions, every day, across the UAE.' },
    { line: 'Beyond the <em>workout.</em>', sub: 'Coaching, community, and what happens after.' },
  ];

  function renderStatement(st, span) {
    return '<div class="bl-tile bl-tile--say" style="grid-column:span ' + span + ';grid-row:span 1">'
      + '<span class="bl-mark" aria-hidden="true"></span>'
      + '<div class="bl-tile-inner">'
      +   '<div class="bl-say">' + st.line + '</div>'
      +   '<div class="bl-say-sub">' + escapeHtml(st.sub) + '</div>'
      + '</div>'
      + '</div>';
  }

  function renderTile(p, shape) {
    var hasImg = !!p.cover_image_url;
    // Artwork always wins: a post with a cover gets the photo treatment
    // whatever shape it landed on, so we never hide a good image behind
    // a solid block. Posts WITHOUT a cover become the lime/dark blocks,
    // alternating so two of a kind never sit side by side — that's what
    // keeps the mosaic varied. The full-width statement bands guarantee
    // the lime rhythm even on an all-photo run.
    var kind = hasImg ? 'photo' : (shape.alt || 'dark');

    var cls = ['bl-tile', 'bl-tile--' + kind];
    if (shape.feature) cls.push('bl-tile--feature');
    if (shape.right)   cls.push('bl-tile--right');

    var meta = escapeHtml(relTime(p.published_at || p.created_at))
      + ' · <span class="author">' + escapeHtml(authorName(p)) + '</span>';

    var img = (kind === 'photo' && hasImg)
      ? '<img src="' + escapeHtml(p.cover_image_url) + '" alt="" '
        + (shape.feature ? 'loading="eager"' : 'loading="lazy"') + '>'
      : '';

    return '<a class="' + cls.join(' ') + '" href="/blog/' + encodeURIComponent(p.slug) + '"'
      + ' style="grid-column:span ' + shape.c + ';grid-row:span ' + shape.r + '">'
      + img
      + '<span class="bl-mark" aria-hidden="true"></span>'
      + (shape.feature ? '<span class="bl-flag">Latest</span>' : '')
      + '<div class="bl-tile-inner">'
      +   (p.category ? '<div class="bl-tile-cat">' + escapeHtml(p.category) + '</div>' : '')
      +   '<div class="bl-tile-title">' + escapeHtml(p.title) + '</div>'
      +   ((p.excerpt && shape.r > 1)
            ? '<p class="bl-tile-excerpt">' + escapeHtml(p.excerpt) + '</p>' : '')
      +   '<div class="bl-tile-meta">' + meta + '</div>'
      + '</div>'
      + '</a>';
  }

  function render(posts) {
    var content = document.getElementById('bl-content');
    if (!posts.length) {
      content.innerHTML = '<div class="bl-empty">'
        + '<h3>Nothing here yet</h3>'
        + '<p>The first ATP post is on its way. In the meantime, head to <a href="/sessions" style="color:var(--green)">Sessions</a> and find your next workout.</p>'
        + '</div>';
      return;
    }

    var html = '';
    var solidFlip = 0;   // alternates the lime/dark fallback
    var stIdx = 0;

    posts.forEach(function (p, i) {
      var shape = TILE_PATTERN[i % TILE_PATTERN.length];
      // Only the very first post is the feature — later cycles reuse the
      // big shape without the "Latest" flag.
      var s = {
        c: shape.c, r: shape.r, kind: shape.kind,
        right: shape.right, feature: shape.feature && i === 0,
        // Only advance the flip when the tile ACTUALLY becomes a solid
        // block, so lime and dark truly alternate among the imageless
        // posts instead of drifting with the overall index.
        alt: !p.cover_image_url
          ? ((solidFlip++ % 2 === 0) ? 'lime' : 'dark')
          : 'dark',
      };
      html += renderTile(p, s);

      // A full-width statement band closes each complete cycle. Spanning
      // all 12 columns means it can never leave a gap, whatever the
      // post count.
      if ((i + 1) % CYCLE === 0 && posts.length > i + 1) {
        html += renderStatement(STATEMENTS[stIdx % STATEMENTS.length], 12);
        stIdx++;
      }
    });

    content.innerHTML = '<div class="bl-mosaic">' + html + '</div>';
  }

  function loadCategories() {
    return fetch('/api/blog/categories', { cache: 'no-cache' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        var cats = (d && d.categories) || [];
        if (!cats.length) return;
        var chipsEl = document.getElementById('bl-chips');
        cats.forEach(function (c) {
          var btn = document.createElement('button');
          btn.className = 'bl-chip';
          btn.setAttribute('data-cat', c.category);
          btn.textContent = c.category + ' · ' + c.n;
          chipsEl.appendChild(btn);
        });
        document.getElementById('bl-filters').style.display = '';
        chipsEl.addEventListener('click', function (ev) {
          var t = ev.target.closest('button.bl-chip');
          if (!t) return;
          Array.from(chipsEl.children).forEach(function (c) { c.classList.remove('active'); });
          t.classList.add('active');
          loadPosts(t.getAttribute('data-cat') || '');
        });
      })
      .catch(function () { /* hidden by default */ });
  }

  function loadPosts(category) {
    var qs = category ? '?category=' + encodeURIComponent(category) + '&limit=24' : '?limit=24';
    var content = document.getElementById('bl-content');
    content.innerHTML =
      '<div class="bl-grid">' +
        '<div class="bl-skel"><div class="bl-skel-cover"></div><div class="bl-skel-body"><div class="bl-skel-line tall"></div><div class="bl-skel-line"></div></div></div>' +
        '<div class="bl-skel"><div class="bl-skel-cover"></div><div class="bl-skel-body"><div class="bl-skel-line tall"></div><div class="bl-skel-line"></div></div></div>' +
        '<div class="bl-skel"><div class="bl-skel-cover"></div><div class="bl-skel-body"><div class="bl-skel-line tall"></div><div class="bl-skel-line"></div></div></div>' +
      '</div>';
    fetch('/api/blog' + qs, { cache: 'no-cache' })
      .then(function (r) { return r.json(); })
      .then(function (d) { render((d && d.posts) || []); })
      .catch(function () {
        content.innerHTML = '<div class="bl-empty"><h3>Couldn\'t load posts</h3><p>Try refreshing — or email <a href="mailto:general@atthepark.world" style="color:var(--green)">general@atthepark.world</a>.</p></div>';
      });
  }

  loadCategories();
  loadPosts('');
})();
</script>

</body>
</html>
